# Welcome to your prefect.yaml file! You can use this file for storing and managing
# configuration for deploying your flows. We recommend committing this file to source
# control along with your flow code.

name: "reposync_flow"
prefect-version: 3.6.25

build: null

push: null

pull:
  - prefect.deployments.steps.git_clone:
      id: clone_step
      repository: "https://github.com/singh-gur/reposync_flow.git"
      branch: "main"
  - prefect.deployments.steps.pip_install_requirements:
      id: install_requirements_step
      requirements_file: "{{ clone_step.directory }}/requirements.txt"

deployments:
  - name: "repo_mirror_flow"
    version: 0.1.0
    tags: []
    description: "Prefect flow that mirrors repositories by creating Kubernetes Jobs from YAML configuration"
    schedule:
      cron: "0 */6 * * *"
      timezone: "America/New_York"
    flow_name: "repo_mirror_flow"
    entrypoint: "reposync_flow/flows/repo_mirror_flow.py:run_flow"
    parameters:
      config_path: "configs/repos.yaml"
      job_namespace: "prefect"
      mirror_image: "regv2.gsingh.io/personal/util_scripts"
      target_user_variable_name: "repo_mirror_target_user"
      target_token_block_name: "repo-mirror-target-token"
      service_account_name: "default"
      image_pull_secret: "regv2-secret"
      max_concurrency: 5
    work_pool:
      name: "kubernetes"
      work_queue_name: null
      job_variables:
        namespace: "prefect"
        packages:
          - "prefect-kubernetes>=0.7.2"
        service_account_name: "prefect-worker"
